<svg viewBox="0 0 1180 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PitBrain's agent pipeline is a LangGraph StateGraph. A Supervisor agent tool-calls one of three capabilities based on reasoning about the query, not a rigid intent match. An Analysis stage runs deterministic, per-session-cached metrics and storyline mining. A Narration stage drafts prose per storyline with a local model. A Reliability agent has two jobs: it hard-blocks the whole run if analysis itself errored or came back empty, and it fact-checks every narrated number against that storyline's own supporting facts, looping back to Narration with targeted correction feedback for up to two redraft rounds. Only storylines that pass are published; a storyline still failing after its redraft is excluded from the report, not shown with a warning. Every draft and verdict is logged for audit regardless.">
<style>
  .box-title { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; font-weight: 700; font-size: 16px; fill: #ffffff; }
  .box-sub { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; fill: #ffffff; opacity: 0.92; }
  .h1 { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; font-weight: 700; font-size: 22px; fill: #14171a; }
  .h2 { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; font-style: italic; font-size: 13px; fill: #54606b; }
  .arrow-label { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; fill: #6b7178; }
  .loop-label { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; fill: #6b3fa0; font-style: italic; }
  .gray-label { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; fill: #868f97; font-style: italic; }
  .foot-title { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; font-weight: 700; font-size: 13px; fill: #14171a; }
  .foot-body { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; font-size: 11.5px; fill: #3c4652; }
  .foot-note { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; fill: #868f97; font-style: italic; }
</style>
<rect x="0" y="0" width="1180" height="920" fill="#f6f6f4" />

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#16181b" />
  </marker>
  <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#9aa2a9" />
  </marker>
  <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0" />
  </marker>
</defs>

<text x="40" y="46" class="h1">PitBrain agent pipeline — supervisor/graph.py</text>
<text x="40" y="70" class="h2">a real LangGraph StateGraph, not a conceptual diagram</text>

<!-- Row 1 (y 110-200): User query (x 30-170, cx 100) -> Supervisor (220-440, cx 330)
     -> Analysis (490-720, cx 605)   ...   Report (820-970, cx 895) -->

<rect x="30" y="120" width="140" height="70" rx="10" fill="#3c4652" />
<text x="100" y="150" text-anchor="middle" class="box-title">User query</text>
<text x="100" y="168" text-anchor="middle" class="box-sub">plain English</text>
<path d="M170,155 L218,155" stroke="#16181b" stroke-width="1.8" marker-end="url(#arrow)" fill="none" />

<rect x="220" y="110" width="220" height="90" rx="10" fill="#2a78d6" />
<text x="330" y="146" text-anchor="middle" class="box-title">Supervisor</text>
<text x="330" y="166" text-anchor="middle" class="box-sub">tool-calling · llama3.2:3b</text>
<text x="330" y="182" text-anchor="middle" class="box-sub">reasons about phrasing</text>
<path d="M440,155 L488,155" stroke="#16181b" stroke-width="1.8" marker-end="url(#arrow)" fill="none" />
<text x="330" y="222" text-anchor="middle" class="arrow-label">run_weekend_rundown · run_pace_analysis · run_driver_comparison</text>

<rect x="490" y="110" width="230" height="90" rx="10" fill="#0f8a8a" />
<text x="605" y="146" text-anchor="middle" class="box-title">Analysis</text>
<text x="605" y="166" text-anchor="middle" class="box-sub">deterministic · session-cached</text>
<text x="605" y="182" text-anchor="middle" class="box-sub">18 storyline detectors</text>
<path d="M605,200 L605,248" stroke="#16181b" stroke-width="1.8" marker-end="url(#arrow)" fill="none" />

<rect x="820" y="110" width="150" height="90" rx="10" fill="#1a7a43" />
<text x="895" y="146" text-anchor="middle" class="box-title">Report</text>
<text x="895" y="166" text-anchor="middle" class="box-sub">verified storylines</text>
<text x="895" y="182" text-anchor="middle" class="box-sub">only, ever</text>

<!-- Row 2 (y 250-340): Narration (490-720, cx 605) -> Reliability (770-1020, cx 895,
     centered under Report so the vertical arrow up to Report is a straight line) -->

<rect x="490" y="250" width="230" height="90" rx="10" fill="#eb6834" />
<text x="605" y="286" text-anchor="middle" class="box-title">Narration</text>
<text x="605" y="306" text-anchor="middle" class="box-sub">drafts prose per storyline</text>
<text x="605" y="322" text-anchor="middle" class="box-sub">llama3.2:3b</text>
<path d="M720,295 L768,295" stroke="#16181b" stroke-width="1.8" marker-end="url(#arrow)" fill="none" />

<rect x="770" y="250" width="250" height="90" rx="10" fill="#6b3fa0" />
<text x="895" y="282" text-anchor="middle" class="box-title">Reliability</text>
<text x="895" y="302" text-anchor="middle" class="box-sub">1. analysis-error hard gate</text>
<text x="895" y="318" text-anchor="middle" class="box-sub">2. per-storyline fact-check</text>

<!-- redraft loop, drawn above the Narration/Reliability gap -->
<path d="M770,275 C 745,240 720,240 720,275" stroke="#6b3fa0" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowPurple)" />
<text x="745" y="225" text-anchor="middle" class="loop-label">redraft ≤2 rounds,</text>
<text x="745" y="238" text-anchor="middle" class="loop-label">targeted correction feedback</text>

<!-- Reliability -> Report: straight vertical, both centered on x=895 -->
<path d="M895,250 L895,202" stroke="#16181b" stroke-width="1.8" marker-end="url(#arrow)" fill="none" />

<!-- Row 3 (y 410-500): Blocked (820-970, cx 895) directly below Reliability —
     straight vertical arrow, no overlap with Reliability (340 -> 410 gap) -->
<rect x="820" y="410" width="150" height="90" rx="10" fill="#767f86" />
<text x="895" y="446" text-anchor="middle" class="box-title">Blocked</text>
<text x="895" y="466" text-anchor="middle" class="box-sub">no report</text>
<text x="895" y="482" text-anchor="middle" class="box-sub">written</text>
<path d="M895,340 L895,408" stroke="#16181b" stroke-width="1.8" marker-end="url(#arrow)" fill="none" />
<text x="975" y="378" class="gray-label">analysis errored / empty</text>

<!-- Supervisor -> Blocked (couldn't route): curves down and across, well clear of
     every box (Supervisor bottom y=200, Blocked left edge x=820,y=455) -->
<path d="M330,200 C 330,330 450,470 818,460" stroke="#9aa2a9" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowGray)" />
<text x="470" y="400" text-anchor="middle" class="gray-label">couldn't determine which</text>
<text x="470" y="414" text-anchor="middle" class="gray-label">capability to route to</text>

<!-- bottom explanation panel -->
<line x1="30" y1="540" x2="1150" y2="540" stroke="#e1e2e0" stroke-width="1" />

<text x="40" y="580" class="foot-title">Reliability has two distinct jobs, not one check:</text>
<text x="40" y="608" class="foot-body">1. Analysis-level gate — if the analysis stage errored or came back empty, the run hard-fails straight to Blocked. No report is</text>
<text x="55" y="626" class="foot-body">    ever written from bad or missing data.</text>
<text x="40" y="652" class="foot-body">2. Narration-level fact-check — every number a storyline's drafted paragraph cites must trace back to that storyline's own</text>
<text x="55" y="670" class="foot-body">    supporting facts, and its subject must actually be named (catches the model substituting a different real driver while</text>
<text x="55" y="688" class="foot-body">    still citing genuine numbers). A failed check loops back to Narration with the specific correction needed, for up to 2</text>
<text x="55" y="706" class="foot-body">    rounds — a storyline still failing after that is excluded from the published report entirely, never shown with a caveat.</text>

<text x="40" y="746" class="foot-title">Analysis reaches beyond the metrics catalog for two storylines:</text>
<text x="40" y="770" class="foot-body">pit-stop strategy efficiency (real counts from raw, unfiltered laps — clean_laps has every pit lap filtered out by definition)</text>
<text x="40" y="788" class="foot-body">and qualifying pace vs. top speed by team (an optional second session fetch).</text>

<text x="40" y="826" class="foot-title">Every run is logged, pass or fail:</text>
<text x="40" y="850" class="foot-body">supervisor/run_log.json (route + verdict per query) and report_suite/weekend_story_history.json (every draft, every</text>
<text x="55" y="868" class="foot-body">correction prompt, every verdict per storyline) — so an excluded storyline is auditable even though the report stays clean.</text>

<text x="40" y="902" class="foot-note">gemma2:2b was dropped for llama3.2:3b throughout — Gemma's Ollama template doesn't support the tool-calling Supervisor and Analysis depend on.</text>
</svg>
