<svg viewBox="0 0 1000 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A Supervision Agent validates the request's scope, catches failures from any stage, holds multi-turn context, and gates final delivery. It delegates to an Intent Parser Agent, then a tool-calling Analysis Agent (which selects one of three tools grounded in the Analysis Catalog), then a Reporting Agent; before publishing, a Reliability Layer compares every quoted number in the draft against ground truth, corrects deviations, and logs the correction.">
<style>
  .box-title { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; font-weight: 600; font-size: 14px; fill: #16181b; }
  .box-sub { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; fill: #6b7178; }
  .arrow-label { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; fill: #6b7178; }
  .pill-text { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; font-weight: 600; font-size: 14px; fill: #16181b; }
  .rel-title { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; font-weight: 600; font-size: 13px; fill: #c2540f; }
  .rel-sub { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; fill: #6b7178; }
  .step-text { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; fill: #c2540f; }
  .group-label { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; fill: #6b7178; letter-spacing: 0.04em; }
</style>
<rect x="0" y="0" width="1000" height="860" fill="#f6f6f4" />

        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#16181b" />
          </marker>
          <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#c2540f" />
          </marker>
        </defs>

        <!-- User's request -->
        <rect x="400" y="16" width="200" height="40" rx="20" fill="none" stroke="#16181b" stroke-width="1.5" />
        <text x="500" y="41" text-anchor="middle" class="pill-text">User's request</text>

        <!-- arrow to Supervision -->
        <line x1="500" y1="56" x2="500" y2="94" stroke="#16181b" stroke-width="1.5" marker-end="url(#arrow)" />
        <text x="514" y="80" class="arrow-label">submits</text>

        <!-- Supervision Agent (emphasized) -->
        <rect x="320" y="96" width="360" height="64" rx="8" fill="#ffffff" stroke="#16181b" stroke-width="3" />
        <text x="500" y="117" text-anchor="middle" class="box-title">Supervision Agent</text>
        <text x="500" y="134" text-anchor="middle" class="box-sub">validates scope · catches stage failures</text>
        <text x="500" y="149" text-anchor="middle" class="box-sub">holds multi-turn context · gates delivery</text>

        <line x1="500" y1="160" x2="500" y2="198" stroke="#16181b" stroke-width="1.5" marker-end="url(#arrow)" />
        <text x="514" y="184" class="arrow-label">delegates</text>

        <!-- Intent Parser Agent -->
        <rect x="320" y="200" width="360" height="70" rx="8" fill="#ffffff" stroke="#16181b" stroke-width="1.5" />
        <text x="500" y="223" text-anchor="middle" class="box-title">Intent Parser Agent</text>
        <text x="500" y="241" text-anchor="middle" class="box-sub">llama3.2:3b</text>
        <text x="500" y="257" text-anchor="middle" class="box-sub">session · analysis_type · drivers · year</text>

        <line x1="500" y1="270" x2="500" y2="308" stroke="#16181b" stroke-width="1.5" marker-end="url(#arrow)" />
        <text x="514" y="294" class="arrow-label">structured intent</text>

        <!-- Analysis Agent -->
        <rect x="320" y="310" width="360" height="76" rx="8" fill="#ffffff" stroke="#16181b" stroke-width="1.5" />
        <text x="500" y="332" text-anchor="middle" class="box-title">Analysis Agent</text>
        <text x="500" y="350" text-anchor="middle" class="box-sub">llama3.2:3b · tool-calling</text>
        <text x="500" y="366" text-anchor="middle" class="box-sub">picks the tool for the requested analysis</text>

        <!-- branch to tools -->
        <line x1="680" y1="348" x2="722" y2="348" stroke="#16181b" stroke-width="1.5" />
        <text x="722" y="298" class="group-label">tools ↳</text>
        <line x1="722" y1="321" x2="722" y2="405" stroke="#16181b" stroke-width="1.5" />
        <line x1="722" y1="321" x2="732" y2="321" stroke="#16181b" stroke-width="1.5" marker-end="url(#arrow)" />
        <line x1="722" y1="348" x2="732" y2="348" stroke="#16181b" stroke-width="1.5" marker-end="url(#arrow)" />
        <line x1="722" y1="405" x2="732" y2="405" stroke="#16181b" stroke-width="1.5" marker-end="url(#arrow)" />

        <rect x="732" y="304" width="232" height="34" rx="6" fill="#ffffff" stroke="#16181b" stroke-width="1.3" />
        <text x="848" y="325" text-anchor="middle" class="box-sub" style="font-size:11px">Race / Qualifying analysis</text>

        <rect x="732" y="331" width="232" height="34" rx="6" fill="#ffffff" stroke="#16181b" stroke-width="1.3" />
        <text x="848" y="352" text-anchor="middle" class="box-sub" style="font-size:11px">Comparison analysis</text>

        <rect x="732" y="388" width="232" height="34" rx="6" fill="#ffffff" stroke="#16181b" stroke-width="1.3" />
        <text x="848" y="409" text-anchor="middle" class="box-sub" style="font-size:11px">Track analysis</text>

        <!-- Analysis Catalog grounding the tools -->
        <rect x="807" y="440" width="150" height="36" rx="6" fill="none" stroke="#16181b" stroke-width="1.2" stroke-dasharray="3 3" />
        <text x="882" y="462" text-anchor="middle" class="box-sub" style="font-size:11px">Analysis Catalog</text>
        <line x1="882" y1="440" x2="882" y2="424" stroke="#16181b" stroke-width="1.2" marker-end="url(#arrow)" />
        <text x="888" y="434" class="arrow-label">grounds</text>

        <line x1="500" y1="386" x2="500" y2="428" stroke="#16181b" stroke-width="1.5" marker-end="url(#arrow)" />
        <text x="514" y="410" class="arrow-label">facts + chart hints</text>

        <!-- Reporting Agent (emphasized) -->
        <rect x="320" y="430" width="360" height="70" rx="8" fill="#ffffff" stroke="#16181b" stroke-width="3" />
        <text x="500" y="453" text-anchor="middle" class="box-title">Reporting Agent</text>
        <text x="500" y="471" text-anchor="middle" class="box-sub">drafts the editorial narrative</text>
        <text x="500" y="487" text-anchor="middle" class="box-sub">numbers + prose, chart-ready</text>

        <line x1="500" y1="500" x2="500" y2="538" stroke="#16181b" stroke-width="1.5" marker-end="url(#arrow)" />
        <text x="514" y="524" class="arrow-label">draft report</text>

        <!-- Reliability Layer -->
        <rect x="250" y="540" width="500" height="200" rx="10" fill="#f5e6dc" stroke="#c2540f" stroke-width="2" />
        <text x="500" y="565" text-anchor="middle" class="rel-title">Reliability Layer</text>
        <text x="500" y="581" text-anchor="middle" class="rel-sub">checks the draft before anything publishes</text>

        <rect x="270" y="600" width="170" height="50" rx="6" fill="#ffffff" stroke="#c2540f" stroke-width="1.4" />
        <text x="355" y="620" text-anchor="middle" class="step-text">Compare quoted</text>
        <text x="355" y="634" text-anchor="middle" class="step-text">numbers ↔ truth</text>

        <line x1="440" y1="625" x2="466" y2="625" stroke="#c2540f" stroke-width="1.5" marker-end="url(#arrowAccent)" />

        <rect x="470" y="600" width="140" height="50" rx="6" fill="#ffffff" stroke="#c2540f" stroke-width="1.4" />
        <text x="540" y="620" text-anchor="middle" class="step-text">Correct</text>
        <text x="540" y="634" text-anchor="middle" class="step-text">deviations</text>

        <line x1="610" y1="625" x2="636" y2="625" stroke="#c2540f" stroke-width="1.5" marker-end="url(#arrowAccent)" />

        <rect x="640" y="600" width="90" height="50" rx="6" fill="#ffffff" stroke="#c2540f" stroke-width="1.4" />
        <text x="685" y="620" text-anchor="middle" class="step-text">Log</text>
        <text x="685" y="634" text-anchor="middle" class="step-text">record</text>

        <line x1="685" y1="650" x2="685" y2="670" stroke="#c2540f" stroke-width="1.5" marker-end="url(#arrowAccent)" />

        <rect x="630" y="672" width="110" height="32" rx="5" fill="none" stroke="#c2540f" stroke-width="1.2" stroke-dasharray="3 3" />
        <text x="685" y="692" text-anchor="middle" class="rel-sub">reliability_log</text>
        <text x="612" y="666" class="rel-sub" text-anchor="end">writes →</text>

        <text x="270" y="716" class="rel-sub">logs every deviation, so PitBrain's track record is auditable over time</text>

        <line x1="500" y1="740" x2="500" y2="778" stroke="#16181b" stroke-width="1.5" marker-end="url(#arrow)" />
        <text x="514" y="764" class="arrow-label">verified &amp; corrected</text>

        <!-- Verified report -->
        <rect x="380" y="780" width="240" height="44" rx="22" fill="#ffffff" stroke="#16181b" stroke-width="2" />
        <text x="500" y="807" text-anchor="middle" class="pill-text">Verified report</text>
      </svg>